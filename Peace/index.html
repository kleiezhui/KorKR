<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace - Вход в систему</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Анимация заставки -->
    <div id="splash-screen">
        <div class="logo-anim">
            <span class="logo-icon">🌐</span> Peace
        </div>
    </div>

    <!-- Основной контент -->
    <div id="main-content" class="hidden">
        <header>
            <div class="logo">
                <span class="logo-icon">🌐</span> Peace
                <span class="subtitle">Глобальная мобильная связь</span>
            </div>
            <div class="controls">
                <button id="theme-toggle">🌙 Тема</button>
            </div>
        </header>

        <main>
            <div class="login-card">
                <h2>Вход в систему Peace</h2>
                <p class="subtitle-text">Введите учётные данные для входа</p>

                <!-- Уведомления -->
                <div id="message-box" class="message hidden"></div>

                <form id="login-form">
                    <div class="input-group">
                        <label>Логин *</label>
                        <input type="text" id="username" required placeholder="Введите логин">
                    </div>
                    <div class="input-group">
                        <label>Пароль *</label>
                        <input type="password" id="password" required placeholder="Введите пароль">
                    </div>

                    <!-- Капча (Пазл) -->
                    <div class="captcha-container">
                        <p>Соберите пазл: расставьте фрагменты в правильном порядке</p>
                        <div class="puzzle" id="puzzle">
                            <!-- Фрагменты генерируются в JS -->
                        </div>
                        <button type="button" id="refresh-captcha" class="btn-secondary">↻ Обновить пазл</button>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn-primary" id="submit-btn">Войти</button>
                        <button type="button" class="btn-secondary">Регистрация</button>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            <div>Регистрация | Техническая поддержка</div>
            <div>Peace · ИС салона связи</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
